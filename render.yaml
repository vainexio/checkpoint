# Render blueprint. One service: Express serves the API *and* the built React
# app, so there is one URL, no CORS, and nothing for the two halves to know
# about each other. Point Render at this repo with "New > Blueprint", then fill
# in the values marked sync:false (they are secrets and must not live in git).

services:
  - type: web
    name: checkpoint
    runtime: node
    plan: free
    # Root Directory stays at the repo root, because the build has to reach
    # both halves and the server serves the client's dist folder.
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      # fetch() and crypto.randomUUID() need a current runtime.
      - key: NODE_VERSION
        value: 20.11.1
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 12h
      # Live traffic. Leave TRAFFIC_API_KEY unset to run on static baselines.
      - key: TRAFFIC_PROVIDER
        value: tomtom
      - key: TRAFFIC_API_KEY
        sync: false
      # CLIENT_ORIGIN and VITE_API_BASE_URL are deliberately absent: the client
      # calls a relative /api on the same origin, so neither is needed.
