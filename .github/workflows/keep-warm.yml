# Keep the free Render service awake during the hours anyone might open it.
#
# A free service sleeps after ~15 minutes of quiet and takes about 50 seconds
# to wake, which to a passenger — or a panel during a demonstration — looks
# like a broken site. A request every ten minutes keeps it up.
#
# Only 06:00–23:00 Manila, deliberately. Round-the-clock pinging would use
# nearly the whole 750-hour monthly free allowance for one service and keep a
# server awake for nobody; this uses about two thirds of it and leaves the
# night to sleep.
#
# GitHub may run a scheduled job late when it is busy, so treat this as "mostly
# warm", not a guarantee. An uptime monitor (UptimeRobot and the like) does the
# same job from outside GitHub if you would rather.
name: Keep the service warm

on:
  schedule:
    # Every 10 minutes, 22:00–14:59 UTC = 06:00–22:59 Manila.
    - cron: '*/10 22,23,0-14 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the service
        run: |
          # --max-time covers a cold start, which is the case this exists for.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://onroute.cloud/health)
          echo "health returned $code"
          # A wake-up that answers anything at all has done its job; only a
          # connection failure is worth failing the run over.
          test -n "$code" && test "$code" != "000"
